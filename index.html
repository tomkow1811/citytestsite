<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midland Road | Bradford City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        claret: '#7a2346',
                        amber: '#f8a313',
                        darkbg: '#050505', 
                        cardbg: '#0f0f0f',
                        borderline: '#262626'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ultra-sharp minimal scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #262626; }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #f8a313; }
        
        /* Ensures the iframe sits perfectly inside the sharp borders */
        iframe { display: block; }
    </style>
</head>
<body class="bg-darkbg text-gray-300 font-sans selection:bg-amber selection:text-black antialiased min-h-screen">

    <!-- Minimalist Editorial Header -->
    <header class="border-b border-borderline bg-darkbg/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 bg-claret flex items-center justify-center">
                    <span class="font-bold text-white text-xs tracking-tighter">MR</span>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white uppercase">Midland<span class="text-amber">Road</span></h1>
            </div>
            <div class="mt-4 md:mt-0 flex items-center gap-3">
                <div class="flex items-center gap-2 text-xs font-mono text-gray-400 border border-borderline px-3 py-1.5 bg-cardbg">
                    <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
                    SYS.LIVE
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT COLUMN: Segmented Directories -->
        <div class="lg:col-span-3 space-y-6 opacity-0 animate-fade-in">
            
            <!-- Official Directory -->
            <div class="bg-cardbg border border-borderline p-5">
                <h2 class="text-xs font-mono text-gray-500 uppercase tracking-widest mb-4">Official</h2>
                <div class="grid grid-cols-1 gap-2">
                    <a href="https://www.bradfordcityafc.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">Official Site</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.bradfordcitystore.co.uk/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">Club Shop</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.bradfordcityafc.com/tickets/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">Tickets</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                </div>
            </div>

            <!-- Community Directory -->
            <div class="bg-cardbg border border-borderline p-5">
                <h2 class="text-xs font-mono text-gray-500 uppercase tracking-widest mb-4">Community</h2>
                <div class="grid grid-cols-1 gap-2">
                    <a href="https://widthofapost.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">Width of a Post</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://bantamtalk.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">Bantam Talk</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.reddit.com/r/bantams/" target="_blank" class="flex items-center justify-between p-3 border border-borderline hover:border-amber hover:text-amber transition-colors group bg-darkbg">
                        <span class="text-sm font-semibold text-gray-300 group-hover:text-amber">r/bantams</span>
                        <span class="text-xs font-mono text-gray-600 group-hover:text-amber">&nearr;</span>
                    </a>
                </div>
            </div>

            <!-- Brutalist Discord Promo -->
            <a href="#" class="block bg-amber p-5 border border-amber hover:bg-transparent hover:text-amber transition-colors group">
                <h3 class="font-black text-black group-hover:text-amber text-lg uppercase tracking-tight">Join Discord</h3>
                <p class="text-sm text-black/80 group-hover:text-amber/80 mt-1">Live match chat & community</p>
            </a>

        </div>

        <!-- MIDDLE COLUMN: The Multi-Source Aggregator -->
        <div class="lg:col-span-5 bg-cardbg border border-borderline flex flex-col h-[600px] opacity-0 animate-fade-in" style="animation-delay: 0.1s;">
            <div class="p-4 border-b border-borderline flex justify-between items-center bg-darkbg">
                <h2 class="text-xs font-mono text-gray-500 uppercase tracking-widest">Aggregated Feed</h2>
                <span class="text-[10px] font-mono text-amber border border-amber/30 px-1.5 py-0.5 bg-amber/10">SYNCING</span>
            </div>
            
            <div id="live-news-feed" class="overflow-y-auto custom-scrollbar flex-1">
                <!-- Loading State -->
                <div class="p-6 flex flex-col space-y-6 animate-pulse">
                    <div class="h-4 bg-borderline w-3/4"></div>
                    <div class="h-4 bg-borderline w-1/2"></div>
                    <div class="h-4 bg-borderline w-5/6 mt-8"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Live Table -->
        <div class="lg:col-span-4 bg-cardbg border border-borderline h-[600px] opacity-0 animate-fade-in" style="animation-delay: 0.2s;">
            <div class="p-4 border-b border-borderline bg-darkbg">
                <h2 class="text-xs font-mono text-gray-500 uppercase tracking-widest">League Two Table</h2>
            </div>

            <!-- ScoreAxis Iframe -->
            <div class="w-full h-[546px]">
                <iframe src="https://widgets.scoreaxis.com/api/football/league-table/62322c24ab744d39ef6504b6?lang=en&teamLogo=1&tableLines=0&homeAway=1&header=1&position=1&goals=1&gamesCount=1&diff=1&winCount=1&drawCount=1&loseCount=1&lastGames=1&points=1&teamsLimit=all&links=1&noFollowLinks=0&font=inter&fontSize=13&rowDensity=100&widgetWidth=100%25&widgetHeight=100%25&bodyColor=transparent&textColor=%23d4d4d4&linkColor=%23f8a313&borderColor=%23262626&tabColor=transparent" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>

    </main>

    <!-- App Logic: T&A and WOAP RSS Aggregator -->
    <script>
        const woapFeed = 'https://widthofapost.com/feed/';
        const taFeed = 'https://www.thetelegraphandargus.co.uk/sport/sportbcfc/?ref=rss';
        
        const fetchFeed = (url, sourceName, colorClass) => {
            return fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'ok') {
                        return data.items.map(item => ({
                            ...item,
                            source: sourceName,
                            badgeColor: colorClass,
                            timestamp: new Date(item.pubDate.replace(/-/g, '/')).getTime() 
                        }));
                    }
                    return [];
                }).catch(() => []);
        };

        Promise.all([
            fetchFeed(woapFeed, 'WOAP', 'text-amber border-amber/30 bg-amber/10'),
            fetchFeed(taFeed, 'T&A', 'text-gray-300 border-gray-600 bg-gray-800')
        ]).then(results => {
            const combinedFeed = [...results[0], ...results[1]].sort((a, b) => b.timestamp - a.timestamp);
            const feedContainer = document.getElementById('live-news-feed');
            
            feedContainer.innerHTML = ''; 

            if (combinedFeed.length === 0) {
                feedContainer.innerHTML = '<div class="p-6 font-mono text-sm text-gray-500">NO DATA FOUND.</div>';
                return;
            }

            combinedFeed.forEach(item => {
                const timeDiff = Math.round((new Date() - item.timestamp) / (1000 * 60));
                let timeString = timeDiff < 60 ? `${timeDiff}M AGO` : 
                                 timeDiff < 1440 ? `${Math.floor(timeDiff/60)}H AGO` : 
                                 `${Math.floor(timeDiff/1440)}D AGO`;

                feedContainer.innerHTML += `
                    <a href="${item.link}" target="_blank" class="block p-5 border-b border-borderline hover:bg-borderline/30 transition-colors group">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[9px] font-mono uppercase tracking-widest px-1.5 py-0.5 border ${item.badgeColor}">${item.source}</span>
                            <span class="text-[10px] font-mono text-gray-500">${timeString}</span>
                        </div>
                        <h3 class="text-sm font-semibold text-gray-200 group-hover:text-amber transition-colors leading-relaxed pr-4">
                            ${item.title}
                        </h3>
                    </a>
                `;
            });
        });
    </script>
</body>
</html>
