                </div>
            </div>

    </main>

    <!-- App Logic: Multi-feed aggregator -->
    <script>
        const woapFeed = 'https://widthofapost.com/feed/';
        const taFeed = 'https://www.thetelegraphandargus.co.uk/sport/sportbcfc/?ref=rss';
        
        const fetchFeed = (url, sourceName, colorClass) => {
            // Using a public CORS proxy array fallback to ensure reliable fetching
            const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
            return fetch(proxyUrl)
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'ok') {
                        return data.items.map(item => ({
                            ...item,
                            source: sourceName,
                            badgeColor: colorClass,
                            timestamp: new Date(item.pubDate.replace(/-/g, '/')).getTime() 
                        }));
                    }
                    return [];
                }).catch(() => []);
        };

        Promise.all([
            fetchFeed(woapFeed, 'WOAP', 'text-amber border-amber/30 bg-amber/10'),
            fetchFeed(taFeed, 'T&A', 'text-blue-400 border-blue-400/30 bg-blue-400/10')
        ]).then(results => {
            const combinedFeed = [...results[0], ...results[1]].sort((a, b) => b.timestamp - a.timestamp);
            const feedContainer = document.getElementById('live-news-feed');
            
            feedContainer.innerHTML = ''; 

            if (combinedFeed.length === 0) {
                feedContainer.innerHTML = '<div class="p-6 font-mono text-sm text-gray-500 text-center">NO FEED DATA AVAILABLE.</div>';
                return;
            }

            combinedFeed.forEach(item => {
                const timeDiff = Math.round((new Date() - item.timestamp) / (1000 * 60));
                let timeString = timeDiff < 60 ? `${timeDiff}M AGO` : 
                                 timeDiff < 1440 ? `${Math.floor(timeDiff/60)}H AGO` : 
                                 `${Math.floor(timeDiff/1440)}D AGO`;

                feedContainer.innerHTML += `
                    <a href="${item.link}" target="_blank" class="block p-4 m-2 border border-borderline/40 rounded-xl hover:border-amber/50 hover:bg-white/[0.03] transition-all group">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[9px] font-mono uppercase tracking-widest px-2 py-0.5 border rounded-md ${item.badgeColor}">${item.source}</span>
                            <span class="text-[10px] font-mono text-gray-400">${timeString}</span>
                        </div>
                        <h3 class="text-sm font-semibold text-gray-200 group-hover:text-amber transition-colors leading-snug">
                            ${item.title}
                        </h3>
                    </a>
                `;
            });
        });
    </script>
