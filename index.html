<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midland Road | Bradford City</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        claret: '#7a2346',
                        amber: '#f8a313',
                        darkbg: '#05070c', 
                        cardbg: '#0d1322',
                        borderline: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .hover-lift {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .hover-lift:hover {
            transform: translateY(-1px);
            border-color: rgba(248, 163, 19, 0.4);
        }
    </style>
</head>
<body class="bg-darkbg text-gray-200 font-sans selection:bg-amber selection:text-black antialiased min-h-screen">

    <!-- Header -->
    <header class="border-b border-borderline bg-darkbg/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center">
            
            <!-- Redesigned Minimal Crest (Clean Geometric Bantams Motif) -->
            <div class="flex items-center gap-3.5">
                <div class="w-9 h-9 bg-claret rounded-lg flex items-center justify-center shadow-lg border border-amber/30">
                    <svg class="w-5 h-5 text-amber" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white uppercase">Midland<span class="text-amber">Road</span></h1>
                    <p class="text-[9px] font-mono tracking-widest text-gray-400 uppercase">Independent Intelligence Hub</p>
                </div>
            </div>

            <!-- Live Status Bar -->
            <div class="mt-3 md:mt-0 flex items-center gap-2 text-xs font-mono text-gray-300 border border-borderline px-3 py-1.5 rounded-lg bg-cardbg">
                <span class="w-2 h-2 bg-amber rounded-full animate-pulse"></span>
                <span>SYSTEM: <strong class="text-white">ONLINE</strong></span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT COLUMN: Verified Links (Official & Community) -->
        <div class="lg:col-span-4 space-y-6">
            
            <!-- Official Directory -->
            <div class="bg-cardbg border border-borderline rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-mono text-gray-400 uppercase tracking-widest mb-3">Official Club</h2>
                <div class="space-y-2">
                    <a href="https://www.bradfordcityafc.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">Official Site</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.bradfordcitystore.co.uk/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">Club Shop</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.bradfordcityafc.com/tickets/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">Match Tickets</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                </div>
            </div>

            <!-- Community Directory -->
            <div class="bg-cardbg border border-borderline rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-mono text-gray-400 uppercase tracking-widest mb-3">Fan Ecosystem</h2>
                <div class="space-y-2">
                    <a href="https://widthofapost.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">Width of a Post</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://bantamtalk.com/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">Bantam Talk</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                    <a href="https://www.reddit.com/r/bantams/" target="_blank" class="flex items-center justify-between p-3 border border-borderline/60 bg-darkbg/50 rounded-xl hover-lift group">
                        <span class="text-sm font-semibold text-gray-200 group-hover:text-amber">r/bantams</span>
                        <span class="text-xs font-mono text-gray-500 group-hover:text-amber">&nearr;</span>
                    </a>
                </div>
            </div>

        </div>

        <!-- RIGHT COLUMN: Fully Automated Live RSS Stream (Width of a Post) -->
        <div class="lg:col-span-8 bg-cardbg border border-borderline rounded-2xl flex flex-col h-[600px] shadow-xl overflow-hidden">
            <div class="p-4 border-b border-borderline flex justify-between items-center bg-darkbg/50">
                <h2 class="text-xs font-mono text-gray-300 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Verified Live Feed (WOAP)
                </h2>
                <span class="text-[10px] font-mono text-amber border border-amber/30 px-2 py-0.5 bg-amber/10 rounded">AUTO-SYNC</span>
            </div>
            
            <div id="live-news-feed" class="overflow-y-auto custom-scrollbar flex-1 p-4 space-y-3">
                <div class="p-8 font-mono text-xs text-gray-500 text-center animate-pulse">FETCHING LIVE STREAM...</div>
            </div>
        </div>

    </main>

    <!-- App Logic: Pure Automated Feed Script -->
    <script>
        const feedUrl = 'https://widthofapost.com/feed/';
        
        fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`)
            .then(res => res.json())
            .then(data => {
                const feedContainer = document.getElementById('live-news-feed');
                feedContainer.innerHTML = ''; 

                if (data.status !== 'ok' || !data.items.length) {
                    feedContainer.innerHTML = '<div class="p-8 font-mono text-xs text-red-400 text-center">FEED UNAVAILABLE.</div>';
                    return;
                }

                data.items.forEach(item => {
                    const itemDate = new Date(item.pubDate.replace(/-/g, '/'));
                    const timeDiff = Math.round((new Date() - itemDate) / (1000 * 60));
                    let timeString = timeDiff < 60 ? `${timeDiff}M AGO` : 
                                     timeDiff < 1440 ? `${Math.floor(timeDiff/60)}H AGO` : 
                                     `${Math.floor(timeDiff/1440)}D AGO`;

                    feedContainer.innerHTML += `
                        <a href="${item.link}" target="_blank" class="block p-4 border border-borderline/60 bg-darkbg/40 rounded-xl hover-lift group">
                            <div class="flex justify-between items-center mb-1.5">
                                <span class="text-[9px] font-mono uppercase tracking-widest px-2 py-0.5 border rounded text-amber border-amber/30 bg-amber/10">Width of a Post</span>
                                <span class="text-[10px] font-mono text-gray-400">${timeString}</span>
                            </div>
                            <h3 class="text-sm font-semibold text-gray-200 group-hover:text-amber transition-colors leading-snug">
                                ${item.title}
                            </h3>
                        </a>
                    `;
                });
            })
            .catch(() => {
                document.getElementById('live-news-feed').innerHTML = '<div class="p-8 font-mono text-xs text-red-400 text-center">FAILED TO LOAD FEED.</div>';
            });
    </script>
</body>
</html>
